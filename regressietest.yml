# Robot Framework Test Pipeline voor LunchMonkeys
# Deze pipeline staat in: AI-training-application repo
# De tests worden uitgecheckt uit: AI-training repo

name: RobotFramework-Tests-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# Automatische trigger na succesvolle deployment
resources:
  pipelines:
    - pipeline: deployment
      source: 'Deploy pipeline'  # Pas aan naar exacte pipeline naam
      trigger:
        branches:
          include:
            - main

parameters:
  - name: targetEnvironment
    displayName: 'Test Environment'
    type: string
    default: 'production'
    values:
      - production
      - staging
      - development
  
  - name: testSuite
    displayName: 'Test Suite to Run'
    type: string
    default: 'all'
    values:
      - all
      - smoke
      - api
      - ui
      - regression

variables:
  - name: ROBOT_RESULTS_DIR
    value: '$(System.DefaultWorkingDirectory)/robot-tests/results'
  - name: ROBOT_REPORTS_DIR
    value: '$(System.DefaultWorkingDirectory)/robot-tests/reports'

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: RobotFrameworkTests
    displayName: 'Execute Robot Framework Tests'
    timeoutInMinutes: 30
    
    steps:
      # OPTIE 1: Clone de test repository met git command
      - script: |
          echo "📚 Cloning Robot Framework test repository..."
          git clone https://$(System.AccessToken)@dev.azure.com/bluemonkeys123/AI-training/_git/AI-training robot-tests
          cd robot-tests
          git checkout main
          ls -la
        displayName: '📚 Clone Robot Framework Tests'
        
      # OF OPTIE 2: Gebruik Azure CLI (uncomment als optie 1 niet werkt)
      # - task: AzureCLI@2
      #   displayName: '📚 Clone Robot Framework Tests via Azure CLI'
      #   inputs:
      #     azureSubscription: 'Your-Service-Connection'
      #     scriptType: 'bash'
      #     scriptLocation: 'inlineScript'
      #     inlineScript: |
      #       az repos clone --repository AI-training --organization https://dev.azure.com/bluemonkeys123 --project AI-training robot-tests
      #       cd robot-tests
      #       ls -la
        
      # Verifieer repository structuur
      - script: |
          echo "════════════════════════════════════════════════"
          echo "    Repository Structure"
          echo "════════════════════════════════════════════════"
          cd robot-tests
          echo "Current directory: $(pwd)"
          echo ""
          echo "📁 Root directory contents:"
          ls -la
          echo ""
          
          if [ -f "requirements.txt" ]; then
              echo "✅ Found requirements.txt"
              echo "📋 Requirements preview:"
              head -10 requirements.txt
          else
              echo "❌ ERROR: requirements.txt not found!"
              exit 1
          fi
          
          if [ -d "tests" ]; then
              echo ""
              echo "📁 Tests directory found:"
              find tests -type f -name "*.robot" | head -10
          fi
        displayName: '🔍 Verify Repository Structure'
        
      # Setup Python
      - task: UsePythonVersion@0
        displayName: '🐍 Setup Python 3.11'
        inputs:
          versionSpec: '3.11'
          addToPath: true
          
      # Install Python dependencies
      - script: |
          cd robot-tests
          echo "📦 Installing Python dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          echo ""
          echo "✅ Installed packages:"
          pip list | grep -E "robot|browser"
          
          echo ""
          echo "🤖 Robot Framework version:"
          robot --version
        displayName: '📦 Install Dependencies'
        
      # Setup Browser Library
      - script: |
          echo "🌐 Setting up Browser Library..."
          
          # Install Node.js
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          
          # Initialize Browser Library
          cd robot-tests
          rfbrowser init --skip-browsers
          npx playwright install --with-deps chromium
          
          echo "✅ Browser Library ready"
        displayName: '🌐 Setup Browser Library'
        
      # Create output directories
      - script: |
          cd robot-tests
          mkdir -p results
          mkdir -p reports
          echo "📁 Created output directories"
        displayName: '📁 Create Output Directories'
        
      # Wait for services
      - script: |
          echo "⏳ Waiting 30 seconds for services to stabilize..."
          sleep 30
          echo "✅ Proceeding with tests"
        displayName: '⏳ Wait for Services'
        
      # Run Robot Framework Tests
      - script: |
          cd robot-tests
          echo "════════════════════════════════════════════════"
          echo "    🤖 Running Robot Framework Tests"
          echo "════════════════════════════════════════════════"
          echo "Environment: ${{ parameters.targetEnvironment }}"
          echo "Test Suite: ${{ parameters.testSuite }}"
          echo "════════════════════════════════════════════════"
          
          # Determine test path
          TEST_PATH=""
          if [ "${{ parameters.testSuite }}" == "all" ]; then
              TEST_PATH="tests/"
          elif [ -d "tests/${{ parameters.testSuite }}" ]; then
              TEST_PATH="tests/${{ parameters.testSuite }}"
          else
              TEST_PATH="tests/"
          fi
          
          echo "📂 Running tests from: $TEST_PATH"
          
          # Run tests
          robot \
            --outputdir results \
            --variable BROWSER:chromium \
            --variable BROWSER_HEADLESS:true \
            --variable ENVIRONMENT:${{ parameters.targetEnvironment }} \
            --loglevel INFO \
            --reporttitle "LunchMonkeys Tests - ${{ parameters.targetEnvironment }}" \
            --logtitle "Test Logs" \
            --report report.html \
            --log log.html \
            --output output.xml \
            --xunit xunit.xml \
            $TEST_PATH || EXIT_CODE=$?
          
          # Generate combined report
          if [ -f "results/output.xml" ]; then
              echo "📊 Generating reports..."
              rebot \
                --outputdir reports \
                --report report.html \
                --log log.html \
                results/output.xml
          fi
          
          exit ${EXIT_CODE:-0}
        displayName: '🤖 Execute Tests'
        continueOnError: true
        
      # Publish test results
      - task: PublishTestResults@2
        displayName: '📊 Publish Test Results'
        condition: always()
        inputs:
          testResultsFiles: 'robot-tests/results/xunit.xml'
          testResultsFormat: 'JUnit'
          testRunTitle: 'Robot Framework - ${{ parameters.targetEnvironment }}'
          
      # Upload artifacts
      - task: PublishPipelineArtifact@1
        displayName: '📁 Upload Results'
        condition: always()
        inputs:
          targetPath: 'robot-tests/results'
          artifactName: 'robot-results-$(Build.BuildNumber)'
          
      - task: PublishPipelineArtifact@1
        displayName: '📁 Upload Reports'
        condition: always()
        inputs:
          targetPath: 'robot-tests/reports'
          artifactName: 'robot-reports-$(Build.BuildNumber)'