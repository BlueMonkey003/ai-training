# Robot Framework Test Pipeline voor LunchMonkeys
# Repository: AI-training (Robot Framework tests)
# Gebruikt requirements.txt uit repo root (altijd aanwezig)

name: RobotFramework-Tests-$(Date:yyyyMMdd)$(Rev:.r)

# Geen automatische trigger op code changes
trigger: none

# Geen PR triggers
pr: none

# Automatische trigger na succesvolle deployment
resources:
  pipelines:
    - pipeline: deployment
      source: 'Deploy pipeline'  # Naam van je deployment pipeline
      trigger:
        branches:
          include:
            - main

parameters:
  - name: targetEnvironment
    displayName: 'Test Environment'
    type: string
    default: 'production'
    values:
      - production
      - staging
      - development
  
  - name: testSuite
    displayName: 'Test Suite to Run'
    type: string
    default: 'all'
    values:
      - all
      - smoke
      - api
      - ui
      - regression

variables:
  # Test output directories
  - name: ROBOT_RESULTS_DIR
    value: '$(System.DefaultWorkingDirectory)/results'
  - name: ROBOT_REPORTS_DIR
    value: '$(System.DefaultWorkingDirectory)/reports'

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: RobotFrameworkTests
    displayName: 'Execute Robot Framework Tests'
    timeoutInMinutes: 30
    
    steps:
      # Checkout Robot Framework test repository
      - checkout: self
        clean: true
        fetchDepth: 1
        displayName: '📚 Checkout Robot Framework Tests'
        
      # Toon repo inhoud voor debugging
      - script: |
          echo "════════════════════════════════════════════════"
          echo "    Repository Structure"
          echo "════════════════════════════════════════════════"
          echo "Current directory: $(pwd)"
          echo ""
          echo "📁 Root directory contents:"
          ls -la
          echo ""
          echo "📋 Requirements.txt preview:"
          head -20 requirements.txt
          echo ""
          
          # Check test directory
          if [ -d "tests" ]; then
              echo "📁 Tests directory found:"
              find tests -type f -name "*.robot" | head -10
          else
              echo "⚠️ No tests directory found"
          fi
        displayName: '🔍 Verify Repository Structure'
        
      # Setup Python
      - task: UsePythonVersion@0
        displayName: '🐍 Setup Python 3.11'
        inputs:
          versionSpec: '3.11'
          addToPath: true
          
      # Cache pip packages voor snellere builds
      - task: Cache@2
        displayName: '💾 Cache Python Dependencies'
        inputs:
          key: 'pip | "$(Agent.OS)" | requirements.txt'
          restoreKeys: |
            pip | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.pip
          
      # Installeer Python dependencies
      - script: |
          echo "════════════════════════════════════════════════"
          echo "    Installing Python Dependencies"
          echo "════════════════════════════════════════════════"
          
          # Upgrade pip
          python -m pip install --upgrade pip
          
          # Installeer dependencies uit requirements.txt
          echo "📦 Installing from requirements.txt..."
          pip install --cache-dir $(Pipeline.Workspace)/.pip -r requirements.txt
          
          echo ""
          echo "✅ Installed packages:"
          pip list | grep -E "robot|browser|requests|mongo" || pip list
          
          # Verify Robot Framework installation
          echo ""
          echo "🤖 Robot Framework version:"
          robot --version
        displayName: '📦 Install Python Dependencies'
        
      # Setup Node.js en Browser Library
      - script: |
          echo "════════════════════════════════════════════════"
          echo "    Setting up Browser Library"
          echo "════════════════════════════════════════════════"
          
          # Install Node.js
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          
          # Initialize Browser Library
          echo ""
          echo "🌐 Initializing Browser Library..."
          rfbrowser init --skip-browsers
          
          # Install alleen Chromium voor headless testing
          echo "📦 Installing Chromium browser..."
          npx playwright install --with-deps chromium
          
          echo "✅ Browser Library setup complete"
        displayName: '🌐 Setup Browser Library'
        
      # Create test directories
      - script: |
          echo "📁 Creating test output directories..."
          mkdir -p $(ROBOT_RESULTS_DIR)
          mkdir -p $(ROBOT_REPORTS_DIR)
          
          echo ""
          echo "📋 Available tests:"
          find . -name "*.robot" -type f | sort
        displayName: '📁 Prepare Test Environment'
        
      # Health check - wacht tot services ready zijn
      - task: PowerShell@2
        displayName: '🏥 Wait for Services to be Ready'
        inputs:
          targetType: inline
          pwsh: true
          script: |
            Write-Host "════════════════════════════════════════════════"
            Write-Host "    Service Health Check"
            Write-Host "════════════════════════════════════════════════"
            Write-Host ""
            Write-Host "⏳ Waiting for services to stabilize after deployment..."
            Write-Host ""
            
            # Simpele wait om services tijd te geven om op te starten
            # Je Robot tests zullen zelf de juiste URLs gebruiken
            $waitSeconds = 30
            Write-Host "Waiting $waitSeconds seconds for services to be ready..."
            Start-Sleep -Seconds $waitSeconds
            
            Write-Host "✅ Proceeding with tests"
        continueOnError: true
        
      # Run Robot Framework Tests
      - script: |
          echo "════════════════════════════════════════════════"
          echo "    🤖 Running Robot Framework Tests"
          echo "════════════════════════════════════════════════"
          echo "Environment: ${{ parameters.targetEnvironment }}"
          echo "Test Suite: ${{ parameters.testSuite }}"
          echo "════════════════════════════════════════════════"
          
          # Determine test path
          TEST_PATH=""
          if [ "${{ parameters.testSuite }}" == "all" ]; then
              TEST_PATH="tests/"
          elif [ -d "tests/${{ parameters.testSuite }}" ]; then
              TEST_PATH="tests/${{ parameters.testSuite }}"
          elif [ -d "${{ parameters.testSuite }}" ]; then
              TEST_PATH="${{ parameters.testSuite }}"
          else
              echo "⚠️ Suite '${{ parameters.testSuite }}' not found, running all tests"
              TEST_PATH="tests/"
          fi
          
          # Als tests/ niet bestaat, zoek naar .robot files
          if [ ! -d "$TEST_PATH" ]; then
              echo "Looking for .robot files in current directory..."
              if [ $(find . -name "*.robot" -type f | wc -l) -gt 0 ]; then
                  TEST_PATH="."
              else
                  echo "❌ No robot files found!"
                  exit 1
              fi
          fi
          
          echo "📂 Running tests from: $TEST_PATH"
          echo ""
          
          # Run Robot Framework met Browser Library settings
          robot \
            --outputdir "$(ROBOT_RESULTS_DIR)" \
            --variable BROWSER:chromium \
            --variable BROWSER_HEADLESS:true \
            --variable ENVIRONMENT:${{ parameters.targetEnvironment }} \
            --loglevel INFO \
            --reporttitle "LunchMonkeys Test Report - ${{ parameters.targetEnvironment }}" \
            --logtitle "LunchMonkeys Test Log - ${{ parameters.targetEnvironment }}" \
            --report report.html \
            --log log.html \
            --output output.xml \
            --xunit xunit.xml \
            $TEST_PATH || ROBOT_EXIT_CODE=$?
          
          # Check results
          if [ -f "$(ROBOT_RESULTS_DIR)/output.xml" ]; then
              echo ""
              echo "✅ Test execution completed"
              
              # Generate combined report
              echo "📊 Generating combined reports..."
              rebot \
                --outputdir "$(ROBOT_REPORTS_DIR)" \
                --report report.html \
                --log log.html \
                --reporttitle "LunchMonkeys Combined Report" \
                --logtitle "LunchMonkeys Combined Log" \
                "$(ROBOT_RESULTS_DIR)/output.xml"
              
              echo "📁 Test artifacts:"
              ls -la $(ROBOT_RESULTS_DIR)
          else
              echo "❌ No test results generated!"
              exit 1
          fi
          
          # Exit with Robot Framework exit code if tests failed
          exit ${ROBOT_EXIT_CODE:-0}
        displayName: '🤖 Execute Robot Framework Tests'
        continueOnError: true
        
      # Publish test results to Azure DevOps
      - task: PublishTestResults@2
        displayName: '📊 Publish Test Results to Azure DevOps'
        condition: always()
        inputs:
          testResultsFiles: '$(ROBOT_RESULTS_DIR)/xunit.xml'
          testResultsFormat: 'JUnit'
          testRunTitle: 'Robot Framework - ${{ parameters.targetEnvironment }} - ${{ parameters.testSuite }}'
          failTaskOnFailedTests: false
          publishRunAttachments: true
          mergeTestResults: false
          
      # Upload test reports as artifacts
      - task: PublishPipelineArtifact@1
        displayName: '📁 Upload Test Results'
        condition: always()
        inputs:
          targetPath: '$(ROBOT_RESULTS_DIR)'
          artifactName: 'robot-results-$(Build.BuildNumber)'
          publishLocation: 'pipeline'
          
      # Upload combined reports
      - task: PublishPipelineArtifact@1
        displayName: '📁 Upload Combined Reports'
        condition: always()
        inputs:
          targetPath: '$(ROBOT_REPORTS_DIR)'
          artifactName: 'robot-reports-$(Build.BuildNumber)'
          publishLocation: 'pipeline'
          
      # Generate test summary
      - task: PowerShell@2
        displayName: '📈 Generate Test Summary'
        condition: always()
        inputs:
          targetType: inline
          pwsh: true
          script: |
            Write-Host "════════════════════════════════════════════════"
            Write-Host "    📊 Test Execution Summary"
            Write-Host "════════════════════════════════════════════════"
            
            $outputXml = "$(ROBOT_RESULTS_DIR)/output.xml"
            
            if (Test-Path $outputXml) {
                try {
                    [xml]$results = Get-Content $outputXml
                    $stats = $results.robot.statistics.total.stat
                    
                    $passed = [int]$stats.pass
                    $failed = [int]$stats.fail
                    $total = $passed + $failed
                    $passRate = if ($total -gt 0) { 
                        [math]::Round(($passed / $total) * 100, 2) 
                    } else { 0 }
                    
                    Write-Host ""
                    Write-Host "Test Results:"
                    Write-Host "  ✅ Passed:    $passed"
                    Write-Host "  ❌ Failed:    $failed"
                    Write-Host "  📝 Total:     $total"
                    Write-Host "  📈 Pass Rate: $passRate%"
                    Write-Host ""
                    Write-Host "Environment: ${{ parameters.targetEnvironment }}"
                    Write-Host "Test Suite:  ${{ parameters.testSuite }}"
                    Write-Host ""
                    
                    # Create summary for Azure DevOps
                    $summary = @"
            ## Robot Framework Test Results
            
            | Metric | Value |
            |--------|-------|
            | ✅ **Passed** | $passed |
            | ❌ **Failed** | $failed |
            | 📝 **Total** | $total |
            | 📈 **Pass Rate** | **$passRate%** |
            | 🌍 **Environment** | ${{ parameters.targetEnvironment }} |
            | 🧪 **Test Suite** | ${{ parameters.testSuite }} |
            
            ### 📁 Artifacts
            - Test Results: ``robot-results-$(Build.BuildNumber)``
            - Test Reports: ``robot-reports-$(Build.BuildNumber)``
            "@
                    
                    # Write summary
                    $summaryPath = "$env:AGENT_TEMP/summary.md"
                    $summary | Out-File -FilePath $summaryPath -Encoding utf8
                    Write-Host "##vso[task.uploadsummary]$summaryPath"
                    
                    # Set output variables
                    Write-Host "##vso[task.setvariable variable=TestsPassed;isOutput=true]$passed"
                    Write-Host "##vso[task.setvariable variable=TestsFailed;isOutput=true]$failed"
                    Write-Host "##vso[task.setvariable variable=TestsTotal;isOutput=true]$total"
                    Write-Host "##vso[task.setvariable variable=TestsPassRate;isOutput=true]$passRate"
                    
                    # Log issues if tests failed
                    if ($failed -gt 0) {
                        Write-Host "##vso[task.logissue type=warning]$failed tests failed out of $total tests"
                        
                        # Try to extract failure details
                        $suites = $results.robot.suite
                        if ($suites) {
                            Write-Host ""
                            Write-Host "Failed tests:"
                            foreach ($test in $suites.test) {
                                if ($test.status.status -eq "FAIL") {
                                    Write-Host "  ❌ $($test.name)"
                                    Write-Host "##vso[task.logissue type=error]Test failed: $($test.name)"
                                }
                            }
                        }
                    } else {
                        Write-Host "##[section]🎉 All $total tests passed successfully!"
                    }
                } catch {
                    Write-Host "⚠️ Could not parse test results: $_"
                }
            } else {
                Write-Host "⚠️ No test results file found at: $outputXml"
            }
            
            Write-Host ""
            Write-Host "Pipeline artifacts available for download in Azure DevOps"
            Write-Host "════════════════════════════════════════════════"